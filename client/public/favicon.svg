<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background to match the image exactly -->
  <rect width="512" height="512" fill="#0B0C10"/>
  
  <!-- Central logo group with consistent stroke styling -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="20">
    
    <!-- Left side (Mint Green) -->
    <g stroke="#35E8B1">
      <!-- Standard radiating spokes -->
      <path d="M 256 61 L 256 141"/>
      <path d="M 158.5 87 L 198.5 156.4"/>
      <path d="M 61 256 L 141 256"/>
      <path d="M 87 353.5 L 156.4 313.5"/>
      <path d="M 158.5 425 L 198.5 355.6"/>
      
      <!-- The stylized 'R' merged with the 10 o'clock spoke -->
      <!-- Main body (Spoke -> Top Bar -> Curve -> Middle Bar) -->
      <path d="M 87 158.5 L 156.4 198.5 L 216 198.5 A 28 28 0 0 1 216 254.5 L 175 254.5"/>
      <!-- Diagonal Leg of the 'R' -->
      <path d="M 205 254.5 L 240 313.5"/>
    </g>

    <!-- Right side (Lavender Purple) -->
    <g stroke="#A174FF">
      <!-- Standard radiating spokes -->
      <path d="M 353.5 87 L 313.5 156.4"/>
      <path d="M 451 256 L 371 256"/>
      <path d="M 353.5 425 L 313.5 355.6"/>
      <path d="M 256 451 L 256 371"/>
      
      <!-- The stylized 'N' merged with the 2 o'clock and 4 o'clock spokes -->
      <!-- Right stem bridging the top and bottom spokes -->
      <path d="M 425 353.5 L 355.6 313.5 L 355.6 198.5 L 425 158.5"/>
      <!-- Left stem and diagonal stroke of the 'N' -->
      <path d="M 275 313.5 L 275 198.5 L 355.6 313.5"/>
    </g>
    
  </g>
</svg>
